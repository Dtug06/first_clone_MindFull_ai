spring:
  config:
    activate:
      on-profile: local

  # --- G1-T03: real PostgreSQL 17 connection ---
  # All values are read from environment variables. Local dev loads them
  # from `.env` (git-ignored). See backend/README.md § "Database setup"
  # for the exact steps to create `mindbridge_dev` and `mindbridge_app`.
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    # HikariCP defaults are documented inline. Values shown match Spring
    # Boot 3.3.5 defaults — explicit only for clarity at the MVP stage.
    hikari:
      pool-name: MindBridgeHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # --- G1-T03: JPA + Hibernate layer ---
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns schema changes; Hibernate only verifies entity/schema
      # compatibility and fails startup before a mismatched write can occur.
      ddl-auto: validate
    properties:
      # Enforce UTC at Hibernate layer so any future entity that uses
      # java.time types persists in UTC regardless of host TZ.
      hibernate.jdbc.time_zone: UTC
      # SQL formatting off; we'll enable for debugging in `local` only
      # if a real investigation needs it.
      hibernate.format_sql: false

  # --- G1-T04: Flyway schema migrations ---
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: '0'
    validate-on-migrate: true

# G1-T06: JWT values come from .env (JWT_SECRET, JWT_EXPIRATION)
# application-local.yml picks them up via ${} placeholder in application.yml.
jwt:
  secret: ${JWT_SECRET:mindbridge-jwt-secret-key-for-local-dev-min-32-chars}
  expiration: ${JWT_EXPIRATION:86400000}

logging:
  level:
    root: INFO
    com.mindbridge: INFO
    org.springframework: INFO
    org.hibernate: WARN
    # Make HikariCP pool startup visible so devs can confirm connection.
    com.zaxxer.hikari: INFO

# --- G1-T10: CORS for local development (Vite default port) ---
mindbridge:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

  # --- G4-T09: Data quality thresholds (requires expert review for production) ---
  # Conservative defaults for local dev only.
  data-quality:
    min-coverage-for-low: 0.30
    min-coverage-for-sufficient: 0.60
    min-confidence: 0.50

  # --- G4-T12: Trend calculation thresholds (requires expert review for production) ---
  # Conservative defaults for local dev only.
  trend:
    min-trend-coverage: 0.50
    trend-delta-threshold: 0.05
    high-stress-threshold: 0.70

  # --- Seven-day trend dev seed ---
  # G4: Deterministic 7-day improving-trend seed for one test user.
  # Disabled by default (enabled=false). Set enabled=true and provide user-email
  # to activate. See backend/README.md § "Seven-day trend seed" for usage.
  dev-seed:
    seven-day-trend:
      enabled: ${MINDBRIDGE_TREND_SEED_ENABLED:false}
      user-email: ${MINDBRIDGE_TREND_SEED_USER_EMAIL:}
      target-date: ${MINDBRIDGE_TREND_SEED_TARGET_DATE:}
