spring:
  application:
    name: mindbridge-backend
  profiles:
    active: local
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

# --- G1-T06: JWT authentication ---
jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-ms: ${JWT_EXPIRATION:3600000}

server:
  port: 8080
  servlet:
    context-path: /api/v1
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
  info:
    env:
      enabled: false

# --- G1-T10: OpenAPI / Swagger UI ---
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  # Default for production-like profiles: enabled. Tests/profile `test` can
  # override per-profile if needed.
  show-actuator: false

# --- G1-T10: CORS allowed origins (per-profile) ---
mindbridge:
  cors:
    allowed-origins: []
