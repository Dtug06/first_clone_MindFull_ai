spring:
  config:
    activate:
      on-profile: prod

  # --- G1-T03: production datasource ---
  # Values are required to come from the deploy environment (k8s secret,
  # Vault, etc.). NEVER bake real credentials into this file or into
  # any file committed to source control.
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: MindBridgeHikariPool
      # Higher pool for prod; still conservative for the MVP / student
      # hosting target. Review under real load before scaling further.
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    open-in-view: false
    hibernate:
      # Once Flyway is added in T04, flip to `validate` so an entity
      # vs schema mismatch crashes the boot loud and early.
      ddl-auto: none
    properties:
      hibernate.jdbc.time_zone: UTC

logging:
  level:
    root: WARN
    com.mindbridge: INFO
    org.springframework: WARN

# --- G1-T10: CORS in production ---
# Origins MUST come from the deploy environment (env var).
# If unset, allow-list is empty → no cross-origin allowed (fail-safe).
mindbridge:
  cors:
    allowed-origins: ${MIND_BRIDGE_CORS_ORIGINS:}
  file:
    name: /var/log/mindbridge/backend.log
  # --- G1-T04: Flyway schema migrations ---
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: '0'
    validate-on-migrate: true